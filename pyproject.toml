[project]
name = "harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
